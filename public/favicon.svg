<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Obsidian Base for visibility on any browser tab theme -->
  <rect width="64" height="64" rx="16" fill="#0B0D10"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#232B3B" stroke-width="1.5"/>

  <!-- Layer 3: Base Layer -->
  <path d="M32 50 L51 40 L51 44.5 L32 54.5 L13 44.5 L13 40 Z" fill="#111620" stroke="#00E5FF" stroke-width="2.2" stroke-linejoin="round" opacity="0.85" />

  <!-- Layer 2: Mid Layer -->
  <path d="M32 38 L51 28 L51 32.5 L32 42.5 L13 32.5 L13 28 Z" fill="#151C28" stroke="#00E5FF" stroke-width="2.2" stroke-linejoin="round" opacity="0.95" />

  <!-- Layer 1: Top Isometric Cap -->
  <!-- Top Face -->
  <path d="M32 10 L51 20.5 L32 31 L13 20.5 Z" fill="#1A2434" stroke="#00E5FF" stroke-width="2.4" stroke-linejoin="round" />
  <!-- Left Face -->
  <path d="M13 20.5 L32 31 L32 35.5 L13 25 Z" fill="#131A26" stroke="#00E5FF" stroke-width="2.4" stroke-linejoin="round" />
  <!-- Right Face -->
  <path d="M32 31 L51 20.5 L51 25 L32 35.5 Z" fill="#0D121B" stroke="#00E5FF" stroke-width="2.4" stroke-linejoin="round" />

  <!-- Center Laser Focus Point in Cyan Glow -->
  <circle cx="32" cy="20.5" r="3.2" fill="#00E5FF" />
</svg>
