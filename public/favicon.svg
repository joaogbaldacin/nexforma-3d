<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Glow Filter -->
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0B0D10"/>

  <!-- Layer 3 (Bottom Layer) -->
  <path d="M32 40 L48 31 L48 36 L32 45 L16 36 L16 31 Z" fill="#151921" stroke="#00E5FF" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Layer 2 (Middle Layer) -->
  <path d="M32 30 L48 21 L48 26 L32 35 L16 26 L16 21 Z" fill="#151921" stroke="#00E5FF" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Layer 1 (Top Layer) -->
  <!-- Top Face -->
  <path d="M32 11 L48 20 L32 29 L16 20 Z" fill="#1A212E" stroke="#00E5FF" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Left Face -->
  <path d="M16 20 L32 29 L32 33 L16 24 Z" fill="#151921" stroke="#00E5FF" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Right Face -->
  <path d="M32 29 L48 20 L48 24 L32 33 Z" fill="#0E1218" stroke="#00E5FF" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Neon Core Accent / Nozzle Laser point -->
  <circle cx="32" cy="20" r="2.5" fill="#00E5FF" filter="url(#neon-glow)"/>
</svg>
